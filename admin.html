<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Admin — Control Center</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #050609; --panel: #0b0d12; --line: rgba(255,255,255,.09); --accent: #9b8cff; --text: #f5f7fa; }
body { margin:0; background: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; display: grid; place-items: center; min-height: 100vh; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; width: min(400px, 90%); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
h2 { font-family: 'DM Mono', monospace; font-size: 16px; letter-spacing: .1em; margin-top: 0; margin-bottom: 20px; color: var(--accent); text-transform: uppercase; }
label { font-size: 11px; font-family: 'DM Mono', monospace; color: #7c8493; text-transform: uppercase; display: block; margin-bottom: 6px; }
input { width: 100%; padding: 12px; margin-bottom: 16px; background: #10131b; border: 1px solid var(--line); border-radius: 8px; color: #fff; box-sizing: border-box; outline: none; }
button { width: 100%; padding: 12px; background: var(--accent); border: 0; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
#admin-panel { display: none; }
</style>
</head>
<body>

<div class="card" id="login-card">
  <h2>Admin Verification</h2>
  <label>Admin Passcode</label>
  <input type="password" id="passcode" placeholder="Enter password">
  <button onclick="login()">Access Panel</button>
</div>

<div class="card" id="admin-panel">
  <h2>Vault Control</h2>
  
  <label>Project Price (₹)</label>
  <input type="number" id="project-price" placeholder="2500">

  <label>Master Video URL (Download Link)</label>
  <input type="text" id="master-url" placeholder="https://drive.google.com/...">

  <button onclick="saveChanges()">Save & Update Site</button>
  <p id="status" style="font-size: 12px; margin-top: 10px; color: #8ff0bd; font-family: monospace;"></p>
</div>

<script>
const ADMIN_PASSCODE = "123456"; 
const API_KEY = "$2a$10$wT3yY13vVl0I7c/uG677aO9T2m0O0S1U2K3L4M5N6O7P8Q9R0S1T2";

function login() {
  const pass = document.getElementById("passcode").value;
  if(pass === ADMIN_PASSCODE) {
    document.getElementById("login-card").style.display = "none";
    document.getElementById("admin-panel").style.display = "block";
    loadCurrentData();
  } else {
    alert("Incorrect Passcode!");
  }
}

async function loadCurrentData() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/66f2a74ae41b4d34e43685e1/latest`);
    const data = await res.json();
    if(data.record) {
      document.getElementById("project-price").value = data.record.price;
      document.getElementById("master-url").value = data.record.master_url;
    }
  } catch(e) {
    console.log(e);
  }
}

async function saveChanges() {
  const newPrice = document.getElementById("project-price").value;
  const newUrl = document.getElementById("master-url").value;

  document.getElementById("status").innerText = "Updating...";

  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/66f2a74ae41b4d34e43685e1`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ price: Number(newPrice), master_url: newUrl })
    });

    if(res.ok) {
      document.getElementById("status").innerText = "Updated successfully!";
      setTimeout(() => document.getElementById("status").innerText = "", 3000);
    } else {
      alert("Failed to update");
      document.getElementById("status").innerText = "";
    }
  } catch(e) {
    alert("Error: " + e.message);
    document.getElementById("status").innerText = "";
  }
}
</script>
</body>
</html>
